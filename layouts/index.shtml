<extend template="base.shtml">
<head id="head">
	<style>
		.date {
			font-size: 0.9em;
		}
	</style>
</head>
<body id="body">
	<h1 :text="$page.title"></h1>
	<div :html="$page.content()"></div>
	<div>
		<h2 :text="$i18n.get('recent-posts')"></h2>
		<ul :loop="$site.page('blog').subpages()">
			<li :if="$loop.idx.gt(3).not()">
				<span class="date" :text="$loop.it.date.format($i18n.get('date-format'))"></span>
				<a href="$loop.it.link()" :text="$loop.it.title"></a>
			</li>
		</ul>
	</div>
</body>
